name: Publish Python package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build and test tools
        run: python -m pip install build twine pytest pytest-asyncio
      - name: Test Python client
        run: |
          python -m pip install -e ./python
          python -m pytest python/tests
      - name: Build distributions
        run: python -m build python --outdir python/dist
      - name: Check package metadata
        run: python -m twine check python/dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: python/dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
