# Cloudflare Workers configuration for the hosted supercarto compile endpoint.
#
# Deployment: from this directory run `npx wrangler deploy`. Wrangler bundles the
# TypeScript entry itself (its own esbuild); no build script or npm dependency is
# needed here, and none was added - esbuild is not a devDependency of this repo,
# and the zero-runtime-dependency house rule applies to the worker too.
#
# No bindings, no secrets, no vars required. Optional operator variables (not
# secrets-protected; only for pointing at your own instances):
#   OVERPASS_ENDPOINT   your own Overpass .../interpreter URL (default: public)
#   TERRARIUM_ENDPOINT  Terrarium tile URL template (default: AWS public tiles)

name = "supercarto-compile"
main = "src/worker.ts"
compatibility_date = "2025-12-01"

# nodejs_compat is deliberately NOT set. The imported compile path
# (src/live.ts -> src/pipeline.ts -> src/emit, src/geo, src/ingest, src/scr) uses
# only Web APIs (fetch, URL, AbortController) and pure computation. The modules
# that do use node: built-ins (src/source/gtfs.ts, src/source/protomaps.ts,
# src/binary/compress.ts, src/config.ts, src/index.ts, src/server/*) are never
# imported by the worker, so nothing Node-shaped reaches the bundle.
